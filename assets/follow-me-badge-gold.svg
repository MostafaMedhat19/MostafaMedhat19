<svg xmlns="http://www.w3.org/2000/svg" width="340" height="92" viewBox="0 0 340 92" role="img" aria-labelledby="title desc">
  <title id="title">Follow Me — GitHub</title>
  <desc id="desc">Animated premium black and metallic-gold Follow Me badge with a glowing profile icon.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2B210C"/>
      <stop offset="0.48" stop-color="#171107"/>
      <stop offset="1" stop-color="#090804"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#A96A0E"/>
      <stop offset="0.5" stop-color="#FFE59C"/>
      <stop offset="1" stop-color="#CC8C22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF8D0"/>
      <stop offset="0.5" stop-color="#FFD15C"/>
      <stop offset="1" stop-color="#D88A16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="3" y="3" width="334" height="86" rx="22"/></clipPath>
  </defs>
  <style>
    .person {transform-origin:55px 46px;animation:breathe 2.6s ease-in-out infinite}
    .plus {transform-origin:74px 31px;animation:pulse 1.8s ease-in-out infinite}
    .spark {animation:twinkle 2.4s ease-in-out infinite}
    .spark.two {animation-delay:.9s}
    .sweep {animation:sweep 4.5s ease-in-out infinite}
    @keyframes breathe {0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes pulse {0%,100%{transform:scale(.92);opacity:.72}50%{transform:scale(1.13);opacity:1}}
    @keyframes twinkle {0%,100%{opacity:.25}45%{opacity:1}}
    @keyframes sweep {0%{transform:translateX(-150px)}45%,100%{transform:translateX(390px)}}
    @media (prefers-reduced-motion: reduce) {.person,.plus,.spark,.sweep{animation:none}}
  </style>
  <rect x="3" y="3" width="334" height="86" rx="22" fill="url(#surface)" stroke="url(#edge)" stroke-width="2.1"/>
  <rect x="9" y="9" width="322" height="74" rx="16" fill="none" stroke="#FFE7A1" stroke-opacity=".14"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="-75" y="-20" width="74" height="145" fill="url(#shine)" transform="skewX(-18)"/>
    <circle cx="55" cy="46" r="30" fill="#CA8C20" fill-opacity=".17"/>
    <circle cx="55" cy="46" r="29" stroke="#EFBF5D" stroke-opacity=".28" fill="none"/>
  </g>
  <g class="person">
    <circle cx="52" cy="36" r="10" fill="#FFCF59" opacity=".32" filter="url(#glow)"/>
    <path d="M34 65c1.8-12 8.5-18 18-18s16.2 6 18 18" fill="#FFCF59" opacity=".32" filter="url(#glow)"/>
    <circle cx="52" cy="36" r="9" fill="url(#gold)" stroke="#FFF0BC"/>
    <path d="M35 65c1.7-11 8-16.5 17-16.5S67.3 54 69 65Z" fill="url(#gold)" stroke="#FFF0BC" stroke-linejoin="round"/>
  </g>
  <g class="plus">
    <circle cx="74" cy="31" r="8" fill="#9B6817" stroke="#FFE8A7" stroke-width="1"/>
    <path d="M74 27v8m-4-4h8" stroke="#FFF1C4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <path class="spark" d="M24 22v6m-3-3h6" stroke="#FFE5A2" stroke-width="1.2" stroke-linecap="round"/>
  <circle class="spark two" cx="85" cy="65" r="2" fill="#FFD26D"/>
  <text x="106" y="44" fill="#FFEBC1" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="1.2">FOLLOW ME</text>
  <text x="107" y="64" fill="#F1B74C" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4">ON GITHUB</text>
  <rect x="287" y="30" width="30" height="30" rx="9" fill="#A26A13" fill-opacity=".32" stroke="#F4C45F" stroke-opacity=".4"/>
  <path d="M299 39l7 6-7 6" fill="none" stroke="#FFEAB3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
